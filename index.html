<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPTEC - Iniciar Sesión</title>
  <link rel="icon" href="data:,">
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Google Fonts: IBM Plex Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Hoja de estilos del proyecto -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- PANTALLA PRINCIPAL DE INICIO DE SESIÓN -->
  <main class="login-screen">
    <section class="login-card">
      <div class="brand-mark">
        <img src="images/logo.svg" alt="SIPTEC Logo">
      </div>
      <h1>BIENVENIDO A SIPTEC</h1>
      <p class="subtitle">Sistema de préstamos e inventario de área técnica</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Correo electrónico:</label>
          <input id="email" class="form-control" type="email" autocomplete="email" placeholder="admin@correo.com" required>
        </div>
        <div class="form-group">
          <label for="password">Contraseña:</label>
          <input id="password" class="form-control" type="password" autocomplete="current-password" placeholder="••••••••" required>
        </div>

        <button class="btn-siptec-green" type="submit" style="width: 100%;">
          <i class="bi bi-box-arrow-in-right"></i> Iniciar Sesión
        </button>

        <div id="loginError" class="text-danger small mt-2 d-none text-center"></div>
      </form>

      <footer style="margin-top: 20px;">
        Desarrollado por: Equipo DTC de 2 año de bachillerato de software 2A año 2026
      </footer>
    </section>
  </main>

  <!-- Scripts Modulares -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="config.js"></script>
  <script src="services/api.service.js"></script>
  <script src="services/auth.service.js"></script>
  <script src="controllers/auth.controller.js"></script>
</body>
</html>
