<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPTEC - Usuarios</title>
  <link rel="icon" href="data:,">
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Google Fonts: IBM Plex Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Estilos -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="app-shell">
    <!-- BARRA LATERAL (SIDEBAR EXACTA) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../images/logo.svg" alt="SIPTEC" class="sidebar-logo">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link-item">
          <i class="bi bi-house-door-fill"></i>
          <span>Panel de<br>control</span>
        </a>
        <a href="inventory.html" class="nav-link-item">
          <i class="bi bi-box-seam"></i>
          <span>Herramientas<br>Áreas</span>
        </a>
        <a href="loans.html" class="nav-link-item">
          <i class="bi bi-arrow-left-right"></i>
          <span>Préstamos</span>
        </a>
        <a href="returns.html" class="nav-link-item">
          <i class="bi bi-arrow-counterclockwise"></i>
          <span>Devoluciones</span>
        </a>
        <a href="users.html" class="nav-link-item active">
          <i class="bi bi-people-fill"></i>
          <span>Usuarios</span>
        </a>
        <a href="reports.html" class="nav-link-item">
          <i class="bi bi-file-earmark-text-fill"></i>
          <span>Reportes</span>
        </a>
        <a href="history.html" class="nav-link-item">
          <i class="bi bi-clock-history"></i>
          <span>Historial</span>
        </a>
        <a href="tipo-area.html" class="nav-link-item">
          <i class="bi bi-grid-3x3-gap-fill"></i>
          <span>Tipo<br>área</span>
        </a>
        <a href="settings.html" class="nav-link-item">
          <i class="bi bi-gear-fill"></i>
          <span>Configuración</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="nav-link-item text-danger" style="background: transparent;">
          <i class="bi bi-box-arrow-right"></i>
          <span>Salir</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- TOPBAR -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-search">
            <i class="bi bi-search"></i>
            <input id="usersSearch" type="search" placeholder="Busca herramienta, usuario, Código...">
          </div>
          <button id="refreshBtn" class="topbar-btn" title="Actualizar">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <div class="topbar-right">
          <div class="topbar-chip">
            <i class="bi bi-calendar3"></i>
            <span id="dateText">17 jul 2026</span>
          </div>
          <div class="topbar-chip">
            <i class="bi bi-person-circle"></i>
            <span id="userRoleText">Admin Principal (ADMINISTRADOR)</span>
          </div>
          <a href="../index.html" class="topbar-btn" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </header>

      <!-- VISTA USUARIOS EXACTA A LAS IMÁGENES -->
      <section class="page-container">
        <div class="page-header">
          <h1 class="page-title">Usuarios</h1>
          <button class="btn-siptec-green" data-bs-toggle="modal" data-bs-target="#createUserModal">
            <i class="bi bi-person-plus"></i> + Crear usuario
          </button>
        </div>

        <!-- TABLA DE USUARIOS -->
        <div class="table-panel">
          <table class="siptec-table">
            <thead>
              <tr>
                <th>Nombre</th>
                <th>Correo electrónico</th>
                <th>Rol</th>
                <th>Sección</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="usersTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL: CREAR USUARIO -->
  <div class="modal fade" id="createUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="createUserForm" class="modal-content siptec-modal">
        <div class="modal-header">
          <h5 class="modal-title">Crear usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-6">
            <label class="form-label" for="userFirstName">Nombre</label>
            <input id="userFirstName" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="userLastName">Apellido</label>
            <input id="userLastName" class="form-control" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="userEmail">Correo electrónico</label>
            <input id="userEmail" class="form-control" type="email" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="userPassword">Contraseña</label>
            <input id="userPassword" class="form-control" type="password" minlength="5" required autocomplete="new-password">
          </div>
          <div class="col-6">
            <label class="form-label" for="userRole">Rol</label>
            <select id="userRole" class="form-select" required>
              <option value="">Cargando roles...</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label" for="userSection">Institución</label>
            <select id="userSection" class="form-select" required>
              <option value="">Cargando instituciones...</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-siptec-outline btn-siptec-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-siptec-green btn-siptec-sm">Guardar usuario</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: EDITAR USUARIO -->
  <div class="modal fade" id="editUserModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="editUserForm" class="modal-content siptec-modal">
        <input id="editUserId" type="hidden">
        <div class="modal-header">
          <h5 class="modal-title">Editar usuario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-6">
            <label class="form-label" for="editUserFirstName">Nombre</label>
            <input id="editUserFirstName" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="editUserLastName">Apellido</label>
            <input id="editUserLastName" class="form-control" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="editUserEmail">Correo electrónico</label>
            <input id="editUserEmail" class="form-control" type="email" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="editUserRole">Rol</label>
            <select id="editUserRole" class="form-select">
              <option value="EMPLEADO">EMPLEADO</option>
              <option value="ADMINISTRADOR">ADMINISTRADOR</option>
              <option value="IT">IT</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label" for="editUserSection">Sección</label>
            <select id="editUserSection" class="form-select">
              <option value="ITR">ITR</option>
              <option value="CFP">CFP</option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-siptec-outline btn-siptec-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-siptec-green btn-siptec-sm">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts Modulares -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="../services/api.service.js"></script>
  <script src="../services/auth.service.js"></script>
  <script src="../services/users.service.js?v=users-api-2"></script>
  <script src="../services/roles.service.js"></script>
  <script src="../services/institutions.service.js"></script>
  <script src="../services/permissions.service.js"></script>
  <script src="../services/role-permissions.service.js"></script>
  <script src="../controllers/layout.controller.js"></script>
  <script src="../controllers/users.controller.js?v=users-api-2"></script>
</body>
</html>
