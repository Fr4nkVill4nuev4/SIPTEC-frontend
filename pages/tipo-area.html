<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPTEC - Tipo área</title>
  <link rel="icon" href="data:,">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../images/logo.svg" alt="SIPTEC" class="sidebar-logo">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link-item">
          <i class="bi bi-house-door-fill"></i>
          <span>Panel de<br>control</span>
        </a>
        <a href="inventory.html" class="nav-link-item">
          <i class="bi bi-box-seam"></i>
          <span>Herramientas<br>Áreas</span>
        </a>
        <a href="loans.html" class="nav-link-item">
          <i class="bi bi-arrow-left-right"></i>
          <span>Préstamos</span>
        </a>
        <a href="returns.html" class="nav-link-item">
          <i class="bi bi-arrow-counterclockwise"></i>
          <span>Devoluciones</span>
        </a>
        <a href="users.html" class="nav-link-item">
          <i class="bi bi-people-fill"></i>
          <span>Usuarios</span>
        </a>
        <a href="reports.html" class="nav-link-item">
          <i class="bi bi-file-earmark-text-fill"></i>
          <span>Reportes</span>
        </a>
        <a href="history.html" class="nav-link-item">
          <i class="bi bi-clock-history"></i>
          <span>Historial</span>
        </a>
        <a href="tipo-area.html" class="nav-link-item active">
          <i class="bi bi-grid-3x3-gap-fill"></i>
          <span>Tipo<br>área</span>
        </a>
        <a href="settings.html" class="nav-link-item">
          <i class="bi bi-gear-fill"></i>
          <span>Configuración</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="nav-link-item text-danger" style="background: transparent;">
          <i class="bi bi-box-arrow-right"></i>
          <span>Salir</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-search">
            <i class="bi bi-search"></i>
            <input id="areaTypesSearch" type="search" placeholder="Busca tipo de área...">
          </div>
          <button id="refreshBtn" class="topbar-btn" title="Actualizar">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <div class="topbar-right">
          <div class="topbar-chip">
            <i class="bi bi-calendar3"></i>
            <span id="dateText">19 ago 2026</span>
          </div>
          <div class="topbar-chip">
            <i class="bi bi-person-circle"></i>
            <span id="userRoleText">Admin Principal (ADMINISTRADOR)</span>
          </div>
          <a href="../index.html" class="topbar-btn" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </header>

      <section class="page-container">
        <div class="page-header catalogs-page-header">
          <div>
            <h1 class="page-title">Tipo área</h1>
            <p class="page-subtitle">Datos sincronizados desde /api/tipoArea.</p>
          </div>
          <div class="catalog-summary-pill">
            <i class="bi bi-cloud-check"></i>
            <span id="areaTypesCountText">0 registros</span>
          </div>
        </div>

        <div class="siptec-table-card catalog-data-card">
          <div class="catalog-data-header">
            <div>
              <strong>Tipos de área</strong>
              <p>/api/tipoArea</p>
            </div>
            <span class="badge-pill-state disponible">API</span>
          </div>
          <div class="table-responsive">
            <table class="table table-siptec align-middle mb-0 catalog-table">
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Nombre</th>
                  <th>Origen</th>
                </tr>
              </thead>
              <tbody id="areaTypesTableBody"></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="../services/api.service.js"></script>
  <script src="../services/auth.service.js"></script>
  <script src="../services/area-types.service.js"></script>
  <script src="../services/areas.service.js"></script>
  <script src="../controllers/layout.controller.js"></script>
  <script src="../controllers/area-types.controller.js"></script>
</body>
</html>
