<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIPTEC - Inventario</title>
  <link rel="icon" href="data:,">
  <!-- Bootstrap & Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <!-- Google Fonts: IBM Plex Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Estilos -->
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>

  <div class="app-shell">
    <!-- BARRA LATERAL (SIDEBAR EXACTA A LAS IMÁGENES) -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <img src="../images/logo.svg" alt="SIPTEC" class="sidebar-logo">
      </div>
      <nav class="sidebar-nav">
        <a href="dashboard.html" class="nav-link-item">
          <i class="bi bi-house-door-fill"></i>
          <span>Panel de<br>control</span>
        </a>
        <a href="inventory.html" class="nav-link-item active">
          <i class="bi bi-box-seam"></i>
          <span>Inventario</span>
        </a>
        <a href="loans.html" class="nav-link-item">
          <i class="bi bi-arrow-left-right"></i>
          <span>Préstamos</span>
        </a>
        <a href="returns.html" class="nav-link-item">
          <i class="bi bi-arrow-counterclockwise"></i>
          <span>Devoluciones</span>
        </a>
        <a href="users.html" class="nav-link-item">
          <i class="bi bi-people-fill"></i>
          <span>Usuarios</span>
        </a>
        <a href="reports.html" class="nav-link-item">
          <i class="bi bi-file-earmark-text-fill"></i>
          <span>Reportes</span>
        </a>
        <a href="history.html" class="nav-link-item">
          <i class="bi bi-clock-history"></i>
          <span>Historial</span>
        </a>
        <a href="tipo-area.html" class="nav-link-item">
          <i class="bi bi-grid-3x3-gap-fill"></i>
          <span>Tipo<br>área</span>
        </a>
        <a href="settings.html" class="nav-link-item">
          <i class="bi bi-gear-fill"></i>
          <span>Configuración</span>
        </a>
      </nav>
      <div class="sidebar-footer">
        <button id="logoutBtn" class="nav-link-item text-danger" style="background: transparent;">
          <i class="bi bi-box-arrow-right"></i>
          <span>Salir</span>
        </button>
      </div>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="main-content">
      <!-- BARRA SUPERIOR (TOPBAR EXACTA) -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="topbar-search">
            <i class="bi bi-search"></i>
            <input id="inventorySearch" type="search" placeholder="Busca herramienta, usuario, Código...">
          </div>
          <button id="refreshBtn" class="topbar-btn" title="Actualizar">
            <i class="bi bi-arrow-clockwise"></i>
          </button>
        </div>
        <div class="topbar-right">
          <div class="topbar-chip">
            <i class="bi bi-calendar3"></i>
            <span id="dateText">17 jul 2026</span>
          </div>
          <div class="topbar-chip">
            <i class="bi bi-person-circle"></i>
            <span id="userRoleText">Admin Principal (ADMINISTRADOR)</span>
          </div>
          <a href="../index.html" class="topbar-btn" title="Cerrar sesión">
            <i class="bi bi-box-arrow-right"></i>
          </a>
        </div>
      </header>

      <!-- VISTA INVENTARIO -->
      <section class="page-container">
        <div class="page-header">
          <h1 class="page-title">Inventario</h1>
          <div class="d-flex align-items-center gap-2">
            <button class="btn-siptec-filter" data-filter="all">
              <i class="bi bi-funnel"></i> Todo
            </button>
            <button class="btn-siptec-green" data-bs-toggle="modal" data-bs-target="#addEquipmentModal">
              <i class="bi bi-plus-lg"></i> Agregar producto
            </button>
          </div>
        </div>

        <!-- TABLA DE INVENTARIO EXACTA A LA IMAGEN -->
        <div class="table-panel">
          <table class="siptec-table">
            <thead>
              <tr>
                <th style="width: 30px;"></th>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Área</th>
                <th>Adquisición</th>
                <th>Estado</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="inventoryTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- MODAL: AGREGAR PRODUCTO -->
  <div class="modal fade" id="addEquipmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="addEquipmentForm" class="modal-content siptec-modal">
        <div class="modal-header">
          <h5 class="modal-title">Registrar herramienta</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-6">
            <label class="form-label" for="addCode">Código</label>
            <input id="addCode" class="form-control" placeholder="Ej. TAL-001" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="addCategory">Categoría</label>
            <select id="addCategory" class="form-select">
              <option value="Material de apoyo">Material de apoyo</option>
              <option value="Equipo técnico">Equipo técnico</option>
              <option value="Equipo de medición">Equipo de medición</option>
              <option value="Electrónico">Electrónico</option>
              <option value="Mecánico">Mecánico</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="addName">Nombre</label>
            <input id="addName" class="form-control" placeholder="Nombre de herramienta" required>
          </div>
          <div class="col-12">
            <label class="form-label" for="addArea">Ubicación / Área</label>
            <input id="addArea" class="form-control" value="Bodega técnica" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-siptec-outline btn-siptec-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-siptec-green btn-siptec-sm">Guardar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL: EDITAR PRODUCTO -->
  <div class="modal fade" id="editEquipmentModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form id="editEquipmentForm" class="modal-content siptec-modal">
        <input id="editId" type="hidden">
        <div class="modal-header">
          <h5 class="modal-title">Editar inventario</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body row g-3">
          <div class="col-6">
            <label class="form-label" for="editCode">Código</label>
            <input id="editCode" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="editStatus">Estado</label>
            <select id="editStatus" class="form-select">
              <option value="Disponible">Disponible</option>
              <option value="Prestado">Prestado</option>
              <option value="Dañado">Dañado</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label" for="editName">Nombre</label>
            <input id="editName" class="form-control" required>
          </div>
          <div class="col-6">
            <label class="form-label" for="editCategory">Categoría</label>
            <select id="editCategory" class="form-select">
              <option value="Material de apoyo">Material de apoyo</option>
              <option value="Equipo técnico">Equipo técnico</option>
              <option value="Equipo de medición">Equipo de medición</option>
              <option value="Electrónico">Electrónico</option>
              <option value="Mecánico">Mecánico</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label" for="editArea">Área</label>
            <input id="editArea" class="form-control" required>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-siptec-outline btn-siptec-sm" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-siptec-green btn-siptec-sm">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts Modulares -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
  <script src="../config.js"></script>
  <script src="../services/api.service.js"></script>
  <script src="../services/auth.service.js"></script>
  <script src="../services/inventory.service.js"></script>
  <script src="../controllers/layout.controller.js"></script>
  <script src="../controllers/inventory.controller.js"></script>
</body>
</html>
